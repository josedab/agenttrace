name: "AgentTrace Prompt CI Test"
description: "Run prompt regression tests against baselines on every PR and post comparison results"
author: "AgentTrace"

inputs:
  api-key:
    description: "AgentTrace API key"
    required: true
  api-url:
    description: "AgentTrace API URL"
    required: false
    default: "http://localhost:8080"
  project-id:
    description: "AgentTrace project ID"
    required: true
  baseline-id:
    description: "Baseline ID to compare against (auto-detects from branch if not provided)"
    required: false
  dataset-id:
    description: "Dataset ID to run experiments against"
    required: false
  fail-on-regression:
    description: "Fail the workflow if regressions are detected"
    required: false
    default: "true"
  regression-threshold:
    description: "Minimum score delta to consider a regression (0.0-1.0)"
    required: false
    default: "0.05"
  confidence-level:
    description: "Statistical confidence level for regression detection"
    required: false
    default: "0.95"
  post-pr-comment:
    description: "Post results as a PR comment"
    required: false
    default: "true"
  max-samples:
    description: "Maximum number of dataset samples to run"
    required: false
    default: "100"

outputs:
  run-id:
    description: "The ID of the prompt CI run"
  overall-severity:
    description: "Overall regression severity (none, minor, major, critical)"
  has-regressions:
    description: "Whether any regressions were detected"
  summary:
    description: "Human-readable summary of results"

runs:
  using: "composite"
  steps:
    - name: Run Prompt CI Comparison
      shell: bash
      env:
        AGENTTRACE_API_KEY: ${{ inputs.api-key }}
        AGENTTRACE_API_URL: ${{ inputs.api-url }}
        AGENTTRACE_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        echo "🧪 AgentTrace Prompt CI Test"
        echo "================================"

        # Get current branch and commit
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        COMMIT_SHA="${GITHUB_SHA}"
        PR_NUMBER="${{ github.event.pull_request.number }}"

        echo "Branch: ${BRANCH}"
        echo "Commit: ${COMMIT_SHA}"
        echo "PR: ${PR_NUMBER:-N/A}"

        # Build comparison request
        PAYLOAD=$(cat <<EOF
        {
          "baselineId": "${{ inputs.baseline-id }}",
          "branch": "${BRANCH}",
          "commitSHA": "${COMMIT_SHA}",
          "prNumber": ${PR_NUMBER:-null},
          "regressionThreshold": ${{ inputs.regression-threshold }},
          "confidenceLevel": ${{ inputs.confidence-level }},
          "maxSamples": ${{ inputs.max-samples }}
        }
        EOF
        )

        # Run comparison
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "${AGENTTRACE_API_URL}/api/public/prompt-ci/compare" \
          -H "Authorization: Bearer ${AGENTTRACE_API_KEY}" \
          -H "X-Project-ID: ${AGENTTRACE_PROJECT_ID}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
          echo "❌ API request failed with status ${HTTP_CODE}"
          echo "$BODY"
          exit 1
        fi

        # Parse results
        RUN_ID=$(echo "$BODY" | jq -r '.id // empty')
        SEVERITY=$(echo "$BODY" | jq -r '.overallSeverity // "none"')
        SUMMARY=$(echo "$BODY" | jq -r '.summary // "No summary available"')
        HAS_REGRESSIONS=$(echo "$BODY" | jq -r 'if .overallSeverity != "none" then "true" else "false" end')

        echo ""
        echo "📊 Results:"
        echo "  Run ID: ${RUN_ID}"
        echo "  Severity: ${SEVERITY}"
        echo "  Has Regressions: ${HAS_REGRESSIONS}"
        echo ""
        echo "Summary: ${SUMMARY}"

        # Set outputs
        echo "run-id=${RUN_ID}" >> $GITHUB_OUTPUT
        echo "overall-severity=${SEVERITY}" >> $GITHUB_OUTPUT
        echo "has-regressions=${HAS_REGRESSIONS}" >> $GITHUB_OUTPUT
        echo "summary=${SUMMARY}" >> $GITHUB_OUTPUT

        # Save results for PR comment
        echo "$BODY" > /tmp/prompt-ci-results.json

    - name: Post PR Comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RESULTS=$(cat /tmp/prompt-ci-results.json 2>/dev/null || echo '{}')
        SEVERITY=$(echo "$RESULTS" | jq -r '.overallSeverity // "none"')

        # Build severity emoji
        case "$SEVERITY" in
          "none") EMOJI="✅"; STATUS="No Regressions" ;;
          "minor") EMOJI="⚠️"; STATUS="Minor Regressions" ;;
          "major") EMOJI="🔶"; STATUS="Major Regressions" ;;
          "critical") EMOJI="🔴"; STATUS="Critical Regressions" ;;
          *) EMOJI="ℹ️"; STATUS="Unknown" ;;
        esac

        # Build comparison table
        TABLE="| Metric | Baseline | Current | Delta | Status |\n|--------|----------|---------|-------|--------|\n"
        COMPARISONS=$(echo "$RESULTS" | jq -c '.scoreComparison[]? // empty' 2>/dev/null)

        if [ -n "$COMPARISONS" ]; then
          while IFS= read -r comp; do
            METRIC=$(echo "$comp" | jq -r '.metricName')
            BASELINE=$(echo "$comp" | jq -r '.baselineValue | . * 100 | round / 100')
            CURRENT=$(echo "$comp" | jq -r '.currentValue | . * 100 | round / 100')
            DELTA=$(echo "$comp" | jq -r '.delta | . * 100 | round / 100')
            IS_REG=$(echo "$comp" | jq -r '.isRegression')
            if [ "$IS_REG" = "true" ]; then
              ROW_STATUS="❌ Regression"
            else
              ROW_STATUS="✅ Pass"
            fi
            TABLE="${TABLE}| ${METRIC} | ${BASELINE} | ${CURRENT} | ${DELTA} | ${ROW_STATUS} |\n"
          done <<< "$COMPARISONS"
        fi

        SUMMARY=$(echo "$RESULTS" | jq -r '.summary // "No details available"')

        COMMENT="## ${EMOJI} Prompt CI Test: ${STATUS}

        ${SUMMARY}

        <details>
        <summary>Score Comparison Details</summary>

        $(echo -e "$TABLE")

        </details>

        ---
        *Powered by [AgentTrace](https://github.com/agenttrace/agenttrace) Prompt CI*"

        gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT" || echo "Failed to post PR comment"

    - name: Check for Failures
      if: ${{ inputs.fail-on-regression == 'true' }}
      shell: bash
      run: |
        SEVERITY=$(cat /tmp/prompt-ci-results.json 2>/dev/null | jq -r '.overallSeverity // "none"')
        if [ "$SEVERITY" = "major" ] || [ "$SEVERITY" = "critical" ]; then
          echo "❌ Prompt regression detected (severity: ${SEVERITY})"
          echo "Configure regression-threshold to adjust sensitivity"
          exit 1
        fi
        echo "✅ No blocking regressions detected"
