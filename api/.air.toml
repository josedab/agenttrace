# Air configuration for Go hot-reload during development
# Install: go install github.com/air-verse/air@latest
# Usage: air (from api/ directory) or make dev-hot (from root)

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "bin", "vendor", "node_modules", "migrations", "tests"]
  exclude_file = ["_test.go"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  include_ext = ["go", "graphql", "gql"]
  include_dir = []
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false
  main_only = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
