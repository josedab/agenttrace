# Cloud resource override.
#
# Use with the production base file:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.cloud.yml \
#     --profile with-proxy \
#     up -d --build

services:
  api:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  worker:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  web:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  postgres:
    deploy:
      resources:
        limits:
          memory: 1G

  clickhouse:
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    command:
      [
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    deploy:
      resources:
        limits:
          memory: 512M
