name: agenttrace-e2e

x-api-environment: &api-environment
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_ENV: "test"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "agenttrace"
  POSTGRES_PASSWORD: "agenttrace_e2e"
  POSTGRES_DB: "agenttrace_e2e"
  POSTGRES_SSL_MODE: "disable"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_USER: "agenttrace"
  CLICKHOUSE_PASSWORD: "agenttrace_e2e"
  CLICKHOUSE_DB: "agenttrace"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MINIO_ENABLED: "false"
  JWT_SECRET: "e2e-test-jwt-secret-key-at-least-32-chars"
  LOG_LEVEL: "info"

services:
  postgres:
    image: agenttrace/postgres:e2e
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace_e2e
      POSTGRES_DB: agenttrace_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace -d agenttrace_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  clickhouse:
    image: agenttrace/clickhouse:e2e
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    environment:
      CLICKHOUSE_USER: agenttrace
      CLICKHOUSE_PASSWORD: agenttrace_e2e
      CLICKHOUSE_DB: agenttrace
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "agenttrace",
          "--password",
          "agenttrace_e2e",
          "--database",
          "agenttrace",
          "--query",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  redis:
    image: cgr.dev/chainguard/redis@sha256:6ec869af943bab77848981ab9469f5b7eef97d166c7ee4ebb4f1b006622d54fa
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e

  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    command: ["/app/migrate", "-path", "/app/migrations", "up"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - e2e

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    environment:
      <<: *api-environment
      E2E_TEST_MODE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${E2E_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - e2e

  worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    command: ["/app/worker"]
    environment:
      <<: *api-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - e2e

networks:
  e2e:
    driver: bridge
