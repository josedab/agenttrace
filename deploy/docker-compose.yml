name: agenttrace

x-api-image: &api-image
  image: agenttrace/api:${VERSION:?VERSION required}
  build:
    context: ../api
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:?VERSION required}

x-api-environment: &api-environment
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_ENV: "production"
  SERVER_CSRF_ENABLED: ${SERVER_CSRF_ENABLED:-true}
  SERVER_SECURE_COOKIES: ${SERVER_SECURE_COOKIES:-true}
  PUBLIC_URL: ${PUBLIC_URL:-}
  PRIVACY_NO_EGRESS: ${PRIVACY_NO_EGRESS:-false}
  PRIVACY_REDACTION_ENABLED: ${PRIVACY_REDACTION_ENABLED:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-agenttrace}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
  POSTGRES_DB: ${POSTGRES_DB:-agenttrace}
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
  POSTGRES_ALLOW_INSECURE: ${POSTGRES_ALLOW_INSECURE:-true}
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agenttrace}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD required}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-agenttrace}
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
  REDIS_DB: "0"
  MINIO_ENABLED: ${MINIO_ENABLED:-false}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
  MINIO_BUCKET: ${MINIO_BUCKET:-agenttrace-exports}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  JWT_ACCESS_EXPIRY_MINUTES: ${JWT_ACCESS_EXPIRY_MINUTES:-1440}
  JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-7}
  JWT_ISSUER: ${JWT_ISSUER:-agenttrace}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND:-100}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
  RATE_LIMIT_USER_MAX_PER_MINUTE: ${RATE_LIMIT_USER_MAX_PER_MINUTE:-100}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: "json"
  EVAL_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_REPORTING_ENABLED: ${GITHUB_REPORTING_ENABLED:-false}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
  GITHUB_REPORT_TOKEN: ${GITHUB_REPORT_TOKEN:-}
  OAUTH_CALLBACK_SECRET: ${OAUTH_CALLBACK_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_SAMPLE_RATE: ${SENTRY_SAMPLE_RATE:-1.0}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  OTEL_RECEIVER_ENABLED: ${OTEL_RECEIVER_ENABLED:-false}
  OTEL_RECEIVER_GRPC_PORT: ${OTEL_RECEIVER_GRPC_PORT:-4317}

services:
  clickhouse-init:
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    user: "0:0"
    command: ["chown", "-R", "101:101", "/backups"]
    network_mode: none
    volumes:
      - clickhouse_backups:/backups
    restart: "no"

  postgres:
    image: agenttrace/postgres:${VERSION:?VERSION required}
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenttrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-agenttrace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenttrace} -d ${POSTGRES_DB:-agenttrace}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agenttrace

  clickhouse:
    image: agenttrace/clickhouse:${VERSION:?VERSION required}
    build:
      context: ./clickhouse
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agenttrace}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD required}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-agenttrace}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - clickhouse_backups:/backups
      - ./clickhouse/backup.xml:/etc/clickhouse-server/config.d/backup.xml:ro
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "${CLICKHOUSE_USER:-agenttrace}",
          "--password",
          "${CLICKHOUSE_PASSWORD}",
          "--database",
          "${CLICKHOUSE_DB:-agenttrace}",
          "--query",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agenttrace

  redis:
    image: ${REDIS_IMAGE:-cgr.dev/chainguard/redis@sha256:6ec869af943bab77848981ab9469f5b7eef97d166c7ee4ebb4f1b006622d54fa}
    restart: unless-stopped
    command: ["--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agenttrace

  migrate:
    <<: *api-image
    command: ["/app/migrate", "-path", "/app/migrations", "up"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"
    networks:
      - agenttrace

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
      - "${OTEL_RECEIVER_GRPC_PORT:-4317}:4317"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - agenttrace

  worker:
    <<: *api-image
    command: ["/app/worker"]
    restart: unless-stopped
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agenttrace

  web:
    image: agenttrace/web:${VERSION:?VERSION required}
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      API_INTERNAL_URL: "http://api:8080"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_CALLBACK_SECRET: ${OAUTH_CALLBACK_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - agenttrace

  nginx:
    image: ${NGINX_IMAGE:-cgr.dev/chainguard/nginx@sha256:4a7323c4539d04a2d515f7b5f5f449b0d70d06e8128558585c2cabcc05ad2a76}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloud.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agenttrace
    profiles:
      - with-proxy

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  clickhouse_backups:
  redis_data:

networks:
  agenttrace:
    driver: bridge
