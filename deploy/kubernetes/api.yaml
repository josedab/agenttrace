---
apiVersion: v1
kind: Service
metadata:
  name: agenttrace-api
  namespace: agenttrace
  labels:
    app: agenttrace-api
    app.kubernetes.io/name: agenttrace
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: agenttrace-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenttrace-api
  namespace: agenttrace
  labels:
    app: agenttrace-api
    app.kubernetes.io/name: agenttrace
    app.kubernetes.io/component: api
spec:
  # Realtime hubs are process-local; keep one replica until shared pub/sub is configured.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agenttrace-api
  template:
    metadata:
      labels:
        app: agenttrace-api
        app.kubernetes.io/name: agenttrace
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: agenttrace
      initContainers:
      - name: migrate
        image: agenttrace/api:0.1.0
        imagePullPolicy: IfNotPresent
        command: ["/app/migrate", "-path", "/app/migrations", "up"]
        envFrom:
        - configMapRef:
            name: agenttrace-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: postgres-password
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: clickhouse-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: api
        image: agenttrace/api:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: agenttrace-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: postgres-password
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: clickhouse-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: jwt-secret
        - name: OAUTH_CALLBACK_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: oauth-callback-secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: openai-api-key
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: google-client-id
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: google-client-secret
              optional: true
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: github-client-id
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: github-client-secret
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: stripe-webhook-secret
              optional: true
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: sentry-dsn
              optional: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agenttrace-api
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: agenttrace-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenttrace
  namespace: agenttrace
  labels:
    app.kubernetes.io/name: agenttrace
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agenttrace-api-pdb
  namespace: agenttrace
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: agenttrace-api
