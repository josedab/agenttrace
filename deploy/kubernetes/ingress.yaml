---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenttrace
  namespace: agenttrace
  labels:
    app.kubernetes.io/name: agenttrace
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - agenttrace.example.com
    secretName: agenttrace-tls
  rules:
  - host: agenttrace.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /live
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /version
        pathType: Prefix
        backend:
          service:
            name: agenttrace-api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agenttrace-web
            port:
              number: 3000
