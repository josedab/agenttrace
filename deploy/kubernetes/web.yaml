---
apiVersion: v1
kind: Service
metadata:
  name: agenttrace-web
  namespace: agenttrace
  labels:
    app: agenttrace-web
    app.kubernetes.io/name: agenttrace
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: agenttrace-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenttrace-web
  namespace: agenttrace
  labels:
    app: agenttrace-web
    app.kubernetes.io/name: agenttrace
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: agenttrace-web
  template:
    metadata:
      labels:
        app: agenttrace-web
        app.kubernetes.io/name: agenttrace
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: web
        image: agenttrace/web:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: NEXTAUTH_URL
          value: https://agenttrace.example.com
        - name: AUTH_TRUST_HOST
          value: "true"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: nextauth-secret
        - name: API_INTERNAL_URL
          value: http://agenttrace-api:8080
        - name: OAUTH_CALLBACK_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: oauth-callback-secret
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: google-client-id
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: google-client-secret
              optional: true
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: github-client-id
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: agenttrace-secrets
              key: github-client-secret
              optional: true
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: next-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
