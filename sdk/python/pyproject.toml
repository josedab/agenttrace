[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Python SDK for AgentTrace - Observability for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "observability", "tracing", "ai", "agents", "langfuse"]
authors = [
    { name = "AgentTrace", email = "team@agenttrace.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
openai = ["openai>=2.31.0"]
anthropic = ["anthropic>=0.94.0"]
all = [
    "openai>=2.31.0",
    "anthropic>=0.94.0",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "mypy>=1.19.1",
]

[project.urls]
Homepage = "https://github.com/agenttrace/agenttrace"
Documentation = "https://docs.agenttrace.io"
Repository = "https://github.com/agenttrace/agenttrace"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enforce the current correctness baseline; expand this set as legacy style
# and modernization findings are addressed.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
